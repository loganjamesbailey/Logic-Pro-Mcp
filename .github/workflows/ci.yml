name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 / macOS
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy daemon

      - name: Compile fixed JXA resources
        run: |
          mkdir -p "$RUNNER_TEMP/logic-bridge-jxa"
          for script in bridge_scripts/*.js; do
            osacompile -l JavaScript \
              -o "$RUNNER_TEMP/logic-bridge-jxa/$(basename "$script" .js).scpt" \
              "$script"
            node --check "$script"
          done
          node tests/js/jxa_accessibility_harness.js

      - name: Test fixed Scripter protocol
        run: |
          node --check scripter/LogicBridgeTargets.js
          node tests/js/scripter_harness.js

      - name: Build source and wheel distributions
        run: uv build

      - name: Verify clean installed distribution
        run: uv run pytest -q tests/integration/test_installed_distribution.py
