[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-logic-pro-bridge"
version = "0.1.0"
description = "Local JSON-RPC bridge for allowlisted Logic Pro control over MIDI and macOS Accessibility"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AI-to-Logic Pro IPC Bridge contributors" }]
dependencies = [
  "mcp>=1.28,<2",
  "mido==1.3.3",
  "python-rtmidi==1.5.8",
]

[project.scripts]
logic-bridge = "daemon.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["daemon", "bridge_scripts", "scripter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
files = ["daemon"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["mido", "mido.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"
